name: k26-default-bitstreams
base: core24
adopt-info: version
summary: Load a default bitstream to fpga device on boot
description: |
  This snap application connects with fpgad to load a bitstream to the fpga0 device.
  The contained bitstream is a fan controller for the K*26* series of Xilinx boards.
grade: devel
icon: snap/assets/icon.svg
source-code:
  - https://github.com/canonical/k26-default-bitstreams
license: GPL-3.0
issues:
  - https://github.com/canonical/k26-default-bitstreams/issues
confinement: strict
platforms:
  amd64:
  arm64:
  ppc64el:
  riscv64:
plugs:
  fpgad-dbus:
    interface: dbus
    bus: system
    name: com.canonical.fpgad
  zynqmp-hwmon:
    interface: custom-device
slots:
  provided-content:
    interface: content
    content: provider-content
    source:
      read:
        - $SNAP/data/k26-starter-kits
apps:
  k26-default-bitstreams:
    command: bin/k26-default-bitstreams
    daemon: oneshot
    plugs:
      - fpgad-dbus
    restart-condition: always
    start-timeout: 30s
    install-mode: disable
  fancontrol:
    command: usr/sbin/fancontrol
    daemon: simple
    plugs:
      - zynqmp-hwmon
    restart-condition: always
    restart-delay: 30s
    install-mode: disable
hooks:
  configure:
    environment:
      PYTHONPATH: "$SNAP/usr/lib/python3/dist-packages/"
parts:
  version:
    plugin: nil
    source: .
    build-snaps:
      - jq
    override-pull: |
      craftctl default
      cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r .packages[0].version)
      craftctl set version="$cargo_version+git$(date +'%Y%m%d').$(git describe --always --exclude '*')"
  k26-default-bitstreams:
    plugin: rust
    source: src
    rust-channel: 'stable'
    rust-path:
      - k26-default-bitstreams
  bitstream-data:
    plugin: nil
    source: https://github.com/Xilinx/kria-base-firmware
    source-type: git
    build-packages:
      - xilinx-bootgen
    override-build: |
      ( cd k26_starter_kits; bootgen -image k26_starter_kits.bif -arch zynqmp -o k26_starter_kits.bit.bin -w )
      install -Dm0644 -t $SNAPCRAFT_PART_INSTALL/data/k26-starter-kits \
        k26_starter_kits/k26_starter_kits.bit.bin \
        LICENSE-BINARIES
  fancontrol:
    plugin: dump
    source: fancontrol
    stage-packages:
      - fancontrol:${CRAFT_ARCH_BUILD_FOR}
      - j2cli:${CRAFT_ARCH_BUILD_FOR}
    organize:
     fancontrol.j2: etc/fancontrol.j2
layout:
  /etc/fancontrol:
    bind-file: $SNAP_DATA/fancontrol
